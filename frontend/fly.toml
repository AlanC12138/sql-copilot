# Fly.io config for the SQL Copilot frontend. See
# https://docs.fly.io/reference/configuration
#
# NEXT_PUBLIC_* values are compiled into the client bundle, so they are build
# args rather than runtime secrets. Changing either one needs a rebuild —
# `fly secrets set` will not take effect:
#
#   fly deploy --ha=false \
#     --build-arg NEXT_PUBLIC_API_URL=https://sql-copilot-api.fly.dev \
#     --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_...
#
# CLERK_SECRET_KEY is server-side only and belongs in `fly secrets set`.

app = 'sql-copilot-web'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 3000
  force_https = true
  # Stop when idle, start on the next request — see backend/fly.toml.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
