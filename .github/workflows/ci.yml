name: CI

# push + pull_request only. Never pull_request_target: it runs fork code with a
# write token and this repo's secrets.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    # Without a real Postgres the 17 DB-backed tests skip, and CI reports a pile
    # of passes that prove far less than they look — tenant scoping and the usage
    # window are only meaningful against the real database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sql_copilot_app
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5433/sql_copilot_app
      # No API keys: the agent-loop tests stub the model, so CI must never depend
      # on a vendor's uptime or spend credit. A test that needs a key should skip.
      ANTHROPIC_API_KEY: ""
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
      ENCRYPTION_KEY: ""

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Installed with pip into setup-python's interpreter, NOT pipx. pipx runs
      # Poetry on its own Python (3.14 on current runners), and Poetry builds
      # PEP 517 isolated build environments from whatever interpreter it is
      # itself running on. On 3.14 there is no pydantic-core wheel, so the
      # install fell back to compiling Rust and PyO3 rejected the version.
      # `poetry env use` does not fix this: it only sets the *project* venv,
      # while the failure was in the temporary build env.
      #
      # Version pinned to the one that generated poetry.lock — an unpinned
      # install breaks later when the lock format changes.
      - name: Install Poetry 2.1.0
        run: python -m pip install poetry==2.1.0

      - name: Install dependencies
        run: |
          python --version
          poetry --version
          poetry install --no-interaction

      - name: Run tests
        # pipefail matters: without it the exit status is tee's, so a failing
        # test suite would report success.
        run: |
          set -o pipefail
          poetry run pytest -q 2>&1 | tee result.txt

      - name: Fail if database tests were skipped
        # The suite skips DB tests when Postgres is unreachable, which is correct
        # locally but would silently hollow out CI. Reuses the run above rather
        # than executing the suite a second time.
        run: |
          if grep -q "skipped" result.txt; then
            echo "::error::DB-backed tests skipped — the Postgres service is not reachable."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # NEXT_PUBLIC_* are inlined at build time. These are placeholders so the
          # build can complete; CI only needs to prove it compiles.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIk
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
