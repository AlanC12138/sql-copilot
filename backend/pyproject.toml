[tool.poetry]
name = "sql-copilot-backend"
version = "0.1.0"
description = "Agentic text-to-SQL backend"
authors = ["Alan Chen"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.32"}
anthropic = "^0.40"
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"
pydantic-settings = "^2.6"
sqlparse = "^0.5"
faker = "^33.0"
cryptography = "^43.0"
clerk-backend-api = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
httpx = "^0.27"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
