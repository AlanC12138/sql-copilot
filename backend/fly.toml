# Fly.io config for the SQL Copilot API.
#
# `fly launch` may want to rename this app — the name must be globally unique on
# Fly, so change `app` below if "sql-copilot-api" is taken.
#
# Machines auto-stop when idle and auto-start on the next request. For a
# low-traffic portfolio demo that keeps compute near zero, which is what keeps
# this inside the free monthly allowance; the tradeoff is a cold start on the
# first request after a quiet period.

app = "sql-copilot-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response]
    # SSE: the agent streams tool-call progress, so responses must not be buffered.
    pristine = true

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
