# Fly.io config for the SQL Copilot API. See
# https://docs.fly.io/reference/configuration
#
# sjc because Managed Postgres has no sea region, and the app should sit beside
# its database. `fly launch` rewrites this file (`fly deploy` does not), so
# re-check the comments below if it is ever re-run.

app = 'sql-copilot-api'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8000
  force_https = true
  # Stop when idle, start on the next request: a low-traffic demo then costs
  # almost nothing in compute, which is what keeps this inside Fly's monthly
  # allowance. The tradeoff is a few seconds of cold start after a quiet spell.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options]
    [http_service.http_options.response]
      # The agent streams tool-call progress over SSE. Without pristine, Fly
      # buffers the response and the status updates all arrive at the end.
      pristine = true

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
